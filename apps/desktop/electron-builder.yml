# Packaging for Windows 10/11 and macOS.
#
# Both platforms are built from the same sources; nothing here forks product
# behaviour. Signing credentials come from CI secrets and are never in the repo.
appId: com.vcvfx.desktop
productName: VC VFX
copyright: Copyright © VC VFX

directories:
  output: release
  buildResources: build

# Placeholder 1024px PNGs (dark rounded tile, amber wordmark), generated by
# build/make-icon.mjs. electron-builder derives the .ico and .icns from them.
icon: build/icon.png

files:
  - out/**
  - package.json

# The bundled ffmpeg and ffprobe (addendum 03), fetched and SHA-256-verified
# by scripts/fetch-ffmpeg.mjs into resources/ffmpeg/<platform>-<arch>. They
# go beside app.asar in Resources/ffmpeg, never inside it: an executable
# cannot be spawned from an asar archive. electron-builder expands the macros
# per arch, so the arm64 and x64 macOS builds each get their own binary.
# main/ffmpeg-tools.ts finds them at process.resourcesPath/ffmpeg.
extraResources:
  - from: resources/ffmpeg/${platform}-${arch}
    to: ffmpeg
    filter:
      - ffmpeg
      - ffprobe
      - ffmpeg.exe
      - ffprobe.exe
      - LICENSE.txt
      - README.txt
  # onnxruntime-node for the SAM 2 roto engine (addendum 04), fetched and
  # SHA-512-checked by scripts/fetch-onnxruntime.mjs with only this
  # platform's native binaries. Beside app.asar, never inside it: a native
  # module cannot load from the archive. main/roto/sam2-ort.ts loads it from
  # process.resourcesPath/onnxruntime. The SAM 2 model itself is never
  # shipped; it is downloaded on first use and checked against its pins.
  - from: resources/onnxruntime
    to: onnxruntime

# Installers are uploaded to the private release bucket by CI and handed out as
# short-lived signed URLs, so electron-builder itself publishes nothing.
publish: null

fileAssociations:
  - ext: vcvfx
    name: VC VFX project
    role: Editor

win:
  target:
    - target: nsis
      arch: [x64]
  signingHashAlgorithms: [sha256]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true

mac:
  icon: build/icon-mac.png
  category: public.app-category.video
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  minimumSystemVersion: '11.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

# Notarization is switched on from the command line by CI only when Apple
# credentials are present (`-c.mac.notarize=true`).
